[project]
name = "datacore"
version = "0.2.0"
description = "A standalone data subsystem: prepare a pretokenized, packed, multipart dataset and read it back as flexible-batch-size, DDP-shardable, exactly-resumable batches"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "filelock>=3.19.0",
]

[project.optional-dependencies]
# datacore.reader's batch iterator hands out torch tensors; the write path (manager.prepare,
# writer, packing, sources) never touches torch at all -- see datacore/docs/architecture.md.
torch = [
    "torch>=2.9.1",
]
# datacore.sources.ParquetDirectorySource (a corpus stored as parquet shards) and
# datacore.hub.load_hub_dataset (a HuggingFace Hub dataset's parquet export) -- both import
# pyarrow lazily, inside the call, so importing datacore itself never requires it.
parquet = [
    "pyarrow>=21.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=65.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["datacore*"]

[tool.pytest.ini_options]
testpaths = ["datacore/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
